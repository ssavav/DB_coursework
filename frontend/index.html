<!DOCTYPE html>
<html lang="ru">

<head>
    <meta name="viewport" charset="UTF-8">
    <title>Управление Спортивными Турнирами</title>
    <link rel="icon" type="image/x-icon" href="/img/favicon.png">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/tournament.css">
</head>

<body>

    <header>
        <div class="container">
            <div class="col-2 login-btn">
                <a href="index.html" сlass="login-btn" id="login-tag">Турниры</a>
                <a href="match.html" сlass="login-btn" id="login-tag">Матчи</a>
            </div>
            <div class="col-6" >
                <a href="index.html" id="title-tag">Система Управления Спортивными Турнирами</a>
                
            </div>
            
            <div class="col-2 login-btn">
                <a href="login.html" сlass="login-btn" id="login-tag">Log in</a>
            </div>
            
        </div>
    </header>

    <div class="container main-part">
        <div class="col-1">

        </div>

        <div class="col-8 ">
            <div class="tournament-inpt-group">
                <input type="text" id="name-inpt" placeholder="Введите название турнира">

                <select name="status" id="status-inpt">
                    <option value="">Все статусы</option>
                    <option value="registration">Открыта регистрация</option>
                    <option value="active">Активный</option>
                    <option value="completed">Завершен</option>
                    <option value="cancelled">Отменён</option>
                </select>

                <button id="search-btn">
                    Поиск
                </button>
            </div>
            
         <table>
                <thead>
                    <tr>
                        <th>Название</th>
                        <th>Вид спорта</th>
                        <th>Дата начала</th>
                        <th>Статус</th>
                        <th>Призовой фонд</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                 
                </tbody>
            </table>
        </div>
        <div class="col-1">
            
        </div>

    </div>
    <script type="module" src="/src/index.ts"></script>
</body>
</html>
