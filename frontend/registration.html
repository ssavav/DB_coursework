<!DOCTYPE html>
<html lang="ru">

<head>
    <meta name="viewport" charset="UTF-8">
    <title>Управление Спортивными Турнирами</title>
    <link rel="icon" type="image/x-icon" href="/img/favicon.png">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/login.css">
    <link rel="stylesheet" href="/css/registration.css">
</head>

<body>

    <header>
        <div class="container">
            <div class="col-2 login-btn">
                <a href="index.html" сlass="login-btn" id="tournament-ref">Турниры</a>
                 <a href="match-panel.html" сlass="login-btn" id="match-ref">Матчи</a>
            </div>
            <div class="col-6" >
                <a href="index.html" id="title-tag">Система Управления Спортивными Турнирами</a>
                
            </div>
            
            <div id="auth-area" class="col-2 login-btn">
                <a href="login.html"  id="login-tag">Log in</a>
            </div>
            
        </div>
    </header>

    <div class="container main-part">
        <div class="login-wrapper">
            <form class="login-box" id="register-form">
                <h2>Регистрация</h2>
                
                <input type="text" placeholder="Email" id="email-field" class="login-input" required>
                
                <select name="status" id="role-input" class="login-input" required>
                    <option value="">Роль</option>
                    <option value="organizer">Организатор</option>
                    <option value="manager">Представитель команды</option>
                </select>

                <div id="manager-fields" class="role-fields-container hidden">
                    <input type="text" placeholder="Название команды" id="team-name-field" class="login-input">
                </div>

                <div id="organizer-fields" class="role-fields-container hidden">
                    <input type="text" placeholder="Название компании" id="company-name-field" class="login-input">
                    <input type="text" placeholder="Телефон" id="phone-field" class="login-input">
                </div>

                <input type="password" placeholder="Пароль" id="password-field" class="login-input" required>
                <input type="password" placeholder="Повторите пароль" id="repeat-password-field" class="login-input" required>
                
                <button type="submit" id="submit-btn" class="login-submit">Зарегистрироваться</button>
            </form>

        </div>
    </div>
    <script type="module" src="/src/register.ts"></script>
</body>
</html>
